# Build from this checkout instead of pulling the published images. Use it when
# you are changing anything under docker/ — a released tag cannot contain edits
# you have not published yet.
#
#   podman compose -f compose.yaml -f compose-dev.yaml up -d --build
#
# Everything else (ports, volumes, devices, env_file) comes from compose.yaml;
# this file only replaces where the images come from. The local tags are distinct
# so a dev image never shadows a pulled one.
services:
  glm53f:
    image: localhost/glm53f-server:dev-gpu
    pull_policy: never
    build:
      # Context is the repo root so both stacks share docker/.
      context: ..
      dockerfile: docker/Dockerfile
      # GPU is the Dockerfile's default: CUDA base, ubuntu-cuda-12.8-x64 asset.

